<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("gost-studio-theme") === "light"
            ? "light"
            : "dark";
      } catch {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090b" />
    <title>ГОСТ docx — от темы к готовой работе</title>
    <meta
      name="description"
      content="Курсовая, реферат или дипломная — с текстом, структурой и оформлением по ГОСТу. Выберите тему, настройте план и скачайте документ Word."
    />
    <meta
      property="og:title"
      content="ГОСТ docx — большая работа без лишней работы"
    />
    <meta
      property="og:description"
      content="Ваша тема. Готовый документ. Курсовые, рефераты и дипломные с оформлением по ГОСТу."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
